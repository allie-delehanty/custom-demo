    --brand-footer-bg: #F3F4F6;
    --brand-footer-fg: #111927;
    --brand-border: #E5E7EB;
    --brand-ring: #0C4ECB;
    --brand-heading-font: 'Barlow', sans-serif;
    --brand-body-font: 'Inter', sans-serif;
    --brand-radius: 0.375rem;
    --brand-button-radius: 0.375rem;
    --brand-card-radius: 0.25rem;
    --brand-dark: #0A2F6B;
    --brand-dark-foreground: #ffffff;
