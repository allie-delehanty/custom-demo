  sourceUrl: "https://www.allegromicro.com/en/"
  extractedAt: "2026-09-23T15:30:00Z"
  extractedBy: "cursor"

colors:
  primary: "#0C4ECB"
  primaryForeground: "#ffffff"
  secondary: "#0A1628"
  secondaryForeground: "#ffffff"
  accent: "#0F62FE"
  accentForeground: "#ffffff"
  background: "#ffffff"
  foreground: "#111927"
  muted: "#F8F9FB"
  mutedForeground: "#5A6577"
  headerBackground: "#ffffff"
  headerForeground: "#111927"
  footerBackground: "#ffffff"
  footerForeground: "#111927"
  border: "#E5E7EB"
  ring: "#0C4ECB"
  extra:
    - { name: "heroNavy", value: "#0A1628" }
    - { name: "askAllegroTeal", value: "#00A3A1" }

typography:
  headingFamily: "'Outfit', sans-serif"
  headingWeight: "500"
  bodyFamily: "'Inter', sans-serif"
  bodyWeight: "400"
  monoFamily: "'IBM Plex Mono', monospace"
  googleFontsUrl: "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap"
  scale:
    hero: "3rem"
    h1: "2.5rem"
    h2: "2rem"
    h3: "1.5rem"
    body: "1rem"
    small: "0.875rem"
  headingTransform: "none"
  letterSpacing: "normal"
  lineHeight: "relaxed"

spacing:
  density: "spacious"
  sectionGap: "5rem"
  containerMaxWidth: "1280px"
  containerPadding: "1.5rem"

shape:
  borderRadius: "0px"
  buttonRadius: "9999px"
  cardRadius: "0px"
  imageRadius: "0px"
  shadowStyle: "none"
  borderStyle: "none"

tone:
  overall: "corporate"
  colorMode: "mixed"
  contrast: "high"
  imagery: "photography"
  heroStyle: "split-image-text"
  cardStyle: "flat"
  navStyle: "solid-bar"

tailwind:
  colors:
    brand:
      primary: "#0C4ECB"
      secondary: "#0A1628"
      accent: "#0F62FE"
  fontFamily:
    heading: ["Outfit", "sans-serif"]
    body: ["Inter", "sans-serif"]
  borderRadius:
    DEFAULT: "0px"
    button: "9999px"
    card: "0px"

cssVariables: |
  :root {
    --brand-primary: #0C4ECB;
    --brand-primary-foreground: #ffffff;
    --brand-secondary: #0A1628;
    --brand-secondary-foreground: #ffffff;
    --brand-accent: #0F62FE;
    --brand-accent-foreground: #ffffff;
    --brand-bg: #ffffff;
    --brand-fg: #111927;
    --brand-muted: #F8F9FB;
    --brand-muted-fg: #5A6577;
    --brand-header-bg: #ffffff;
    --brand-header-fg: #111927;
    --brand-footer-bg: #ffffff;
    --brand-footer-fg: #111927;
    --brand-border: #E5E7EB;
    --brand-ring: #0C4ECB;
    --brand-heading-font: 'Outfit', sans-serif;
    --brand-body-font: 'Inter', sans-serif;
    --brand-radius: 0px;
    --brand-button-radius: 9999px;
    --brand-card-radius: 0px;
  }

extraction:
  confidence: "high"
  method: "playwright-full"
  notes:
    - "Playwright scraper succeeded. Screenshot + computed styles used together."
    - "Headings use proprietary Canada Type Gibson. Substituted Outfit (Google Fonts) for the demo — similar humanist geometric sans."
    - "Body is already Inter (self-hosted on allegromicro.com); loading Inter from Google Fonts for the demo."
    - "Primary blue #0C4ECB from computed primary-button background; link blue #0F62FE used as accent."
    - "Hero is deep navy (#0A1628) with white text and an outlined pill CTA — not a filled primary button."
    - "Header and footer are white, not navy. Color mode is mixed: dark hero, light content."
    - "Cards are flat (no shadow, no radius, no border). Product photos sit on white."
    - "Hero CTAs are pill-shaped (fully rounded). Default button radius from CSS is 6px; visual evidence on the homepage is pill, so theme uses pill."
    - "Logo is the rainbow globe + ALLEGRO wordmark (downloaded to docs/ai/themes/allegro-microsystems/images/logo.svg)."
