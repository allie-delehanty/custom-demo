extraction:
  confidence: "high"
  method: "playwright-full"
  notes:
    - "Primary blue #0078CF was sampled from the Search and Log In buttons and the quick-action bar, and matches the computed link color rgb(0, 120, 207)."
    - "Accent #069BD7 is the lighter cyan in the Con Edison logo."
    - "The scraper reported a transparent header and a gray footer. The screenshot shows a white nav under a #2A2A2A utility bar, and the full homepage ends in a dark footer, so those fields follow the screenshot."
    - "Headings use Lexend at weight 800. Body copy uses Open Sans. The icon font coned-icons is proprietary and is not used for text."
    - "Buttons, cards, and images are square. Icon circles inside the action tiles are the exception."
    - "Hero is two full-bleed photos side by side, with white type over the images and a blue action row underneath."
